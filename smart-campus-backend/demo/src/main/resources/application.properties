spring.application.name=demo

# JWT signing (HS256). For real deployments, set a long random secret via env var.
app.jwt.secret=${JWT_SECRET:change-this-dev-secret-key-32chars!!}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:43200}

# Coursework setup: use MySQL (same server you connect to in MySQL Workbench).
#
# Do NOT commit your real DB password into git. Set it the same way you log into Workbench:
#   PowerShell:
#     $env:MYSQL_PASSWORD='(the password you type in Workbench for root@localhost)'
#     .\mvnw.cmd spring-boot:run
#
# Optional local-only profile (embedded H2) if you ever need it:
#   $env:SPRING_PROFILES_ACTIVE='local'
spring.profiles.default=mysql

# Allow large JSON bodies (e.g. Base64 profile images on PUT /api/users/profile)
server.tomcat.max-http-form-post-size=20MB